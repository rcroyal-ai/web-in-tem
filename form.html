<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhập mã hàng</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial; padding: 10px; background: #f5f5f5; }
    h2 { text-align: center; }
    .row { display: flex; gap: 5px; margin-bottom: 10px; }
    input { padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
    .code-input { flex: 1; }
    .qty-input { width: 70px; text-align: center; }
    .scan-btn { width: 50px; background: green; color: white; border: none; border-radius: 6px; }
    button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: none; font-size: 16px; }
    #scanner-container { width: 100%; height: 260px; margin-top: 10px; border-radius: 10px; overflow: hidden; display: none; background: black; }
    #status { text-align: center; margin-top: 10px; font-weight: bold; color: green; }
    #close-camera { background: red; color: white; }
  </style>
</head>
<body>

<h2>Nhập mã hàng</h2>

<div id="list"></div>

<button onclick="addRow()">+ Thêm dòng</button>
<button onclick="submitData()">🚀 Gửi đơn hàng</button>

<div id="status"></div>

<div id="scanner-container"></div>
<button id="close-camera" onclick="stopScan()" style="display:none">✕ Đóng Camera</button>

<!-- Thêm CDN của @zxing/browser vào đây -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.18.6/dist/index.min.js"></script>

<script>
let codeReader;
let currentInput;
let isScanning = false;

function addRow() {
  const div = document.createElement("div");
  div.className = "row";
  div.innerHTML = `
    <input class="code-input" placeholder="Mã hàng">
    <input class="qty-input" type="number" value="1">
    <button class="scan-btn">📷</button>
  `;

  div.querySelector(".scan-btn").onclick = () => {
    startScan(div.querySelector(".code-input"));
  };

  document.getElementById("list").appendChild(div);
}

addRow();

async function startScan(input) {
  if (isScanning) return;

  isScanning = true;
  currentInput = input;

  const container = document.getElementById("scanner-container");
  const status = document.getElementById("status");
  const closeBtn = document.getElementById("close-camera");

  container.style.display = "block";
  closeBtn.style.display = "block";
  status.innerText = "Đang mở camera...";

  codeReader = new ZXing.BrowserMultiFormatReader();
  try {
    // Kiểm tra và lấy danh sách các video input devices
    const videoInputDevices = await codeReader.listVideoInputDevices();
    if (videoInputDevices.length > 0) {
      const deviceId = videoInputDevices[0].deviceId; // Chọn thiết bị đầu tiên
      await codeReader.decodeFromVideoDevice(deviceId, 'scanner-container', (result, err) => {
        if (result) {
          let code = result.getText();
          currentInput.value = code;
          status.innerText = "✅ Quét: " + code;
          setTimeout(() => {
            stopScan();
            addRow();
          }, 700);
        }
        if (err) {
          console.error(err);
        }
      });
      status.innerText = "✅ Đưa mã vào camera";
    } else {
      status.innerText = "❌ Không tìm thấy camera";
      isScanning = false;
    }
  } catch (err) {
    status.innerText = "❌ Không mở được camera";
    isScanning = false;
  }
}

async function stopScan() {
  if (codeReader) {
    try {
      await codeReader.reset();
    } catch (e) {}
  }

  document.getElementById("scanner-container").style.display = "none";
  document.getElementById("close-camera").style.display = "none";
  document.getElementById("status").innerText = "";

  isScanning = false;
}

async function submitData() {
  alert("Demo gửi dữ liệu (bạn giữ nguyên Firebase cũ)");
}
</script>

</body>
</html>
