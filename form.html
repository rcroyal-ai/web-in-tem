<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>

  <!-- QUAN TRỌNG: giúp hiển thị đúng trên điện thoại -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
    }

    .add-btn {
      background: #eee;
    }

    .submit-btn {
      background: #4CAF50;
      color: white;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button class="add-btn" onclick="addRow()">+ Thêm dòng</button>
  <button class="submit-btn" onclick="submitData()">Gửi</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input placeholder="Mã hàng">
        <input placeholder="Số lượng" type="number">
      `;
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        if (inputs[0].value)
          items.push({
            code: inputs[0].value,
            qty: inputs[1].value
          });
      });

      if(items.length === 0){
        alert("Chưa nhập dữ liệu");
        return;
      }

      await addDoc(collection(db, "orders"), {
        items,
        time: Date.now()
      });

      alert("Đã gửi!");
      location.reload();
    }

    addRow();
  </script>
</body>
</html>
