<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .row {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
    }

    .scan-btn {
      width: 70px;
    }

    #video {
      width: 100%;
      height: 260px;
      margin-top: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">Gửi</button>

  <div id="video"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";

      div.innerHTML = `
        <input placeholder="Mã hàng">
        <input placeholder="SL" type="number">
        <button class="scan-btn">📷</button>
      `;

      const btn = div.querySelector("button");
      const input = div.querySelector("input");

      btn.onclick = () => startScan(input);

      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    function startScan(input) {
      currentInput = input;

      const video = document.getElementById("video");
      video.style.display = "block";

      // Kiểm tra xem Quagga đã được khởi tạo chưa
      if (typeof Quagga === 'undefined') {
        alert('Quagga.js chưa được tải hoặc khởi tạo đúng!');
        return;
      }

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: video,
          constraints: {
            facingMode: "environment"
          }
        },
        decoder: {
          readers: ["ean_reader", "code_128_reader"]
        }
      }, function(err) {
        if (err) {
          console.log("Lỗi khi khởi tạo Quagga:", err);
          return;
        }
        console.log("Quagga đã được khởi tạo thành công!");
        Quagga.start();
      });

      Quagga.onDetected(function(data) {
        let raw = data.codeResult.code;

        // lấy mã bắt đầu bằng 893
        let match = raw.match(/893\d{10}/);

        if (match) {
          currentInput.value = match[0];
        } else {
          currentInput.value = raw;
        }

        Quagga.stop();
        video.innerHTML = "";
        video.style.display = "none";

        addRow();
      });
    }

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        if (inputs[0].value)
          items.push({
            code: inputs[0].value,
            qty: inputs[1].value
          });
      });

      if (items.length === 0) {
        alert("Chưa nhập dữ liệu");
        return;
      }

      await addDoc(collection(db, "orders"), {
        items,
        time: Date.now()
      });

      alert("Đã gửi!");
      location.reload();
    }

    addRow();
  </script>

  <!-- thư viện barcode -->
  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
</body>
</html>
