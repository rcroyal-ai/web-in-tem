<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 15px;
      max-width: 500px;
      margin: auto;
    }
    h2 { text-align: center; }
    .row {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 6px;
    }
    .scan-btn {
      width: 70px;
      font-size: 20px;
      background: #4CAF50;
      color: white;
      border: none;
    }
    #scanner-container {
      width: 100%;
      margin: 10px 0;
      display: none;
      border: 3px solid #4CAF50;
      border-radius: 8px;
      min-height: 320px;
      background: #000;
    }
    #status {
      text-align: center;
      margin: 8px 0;
      font-weight: bold;
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">Gửi</button>

  <div id="status"></div>
  <div id="scanner-container"></div>

  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;
    let isScanning = false;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    // ================== CẢI TIẾN CAMERA ==================
    function startScan(input) {
      if (isScanning) return;
      currentInput = input;
      isScanning = true;

      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");

      status.textContent = "Đang mở camera...";
      container.style.display = "block";

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: container,
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        decoder: {
          readers: ["ean_reader", "code_128_reader"],
          multiple: false
        },
        locate: true,
        numOfWorkers: 4,
        frequency: 10
      }, function(err) {
        if (err) {
          console.error(err);
          status.textContent = "❌ Không mở camera. Hãy cho phép quyền Camera!";
          setTimeout(stopScan, 2000);
          return;
        }
        status.textContent = "✅ Camera sẵn sàng - Hướng mã vạch vào khung";
        Quagga.start();
      });

      Quagga.onDetected(handleDetection);
    }

    function handleDetection(data) {
      const raw = data.codeResult.code;
      let code = raw;

      // Ưu tiên mã bắt đầu bằng 893 (EAN-13 Việt Nam)
      const match = raw.match(/893\d{10}/);
      if (match) {
        code = match[0];
      }

      currentInput.value = code;
      document.getElementById("status").textContent = "✅ Đã quét: " + code;

      stopScan();
      addRow();        // Tự động thêm dòng mới
    }

    function stopScan() {
      Quagga.stop();
      Quagga.offDetected(handleDetection);
      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("status").textContent = "";
      isScanning = false;
    }

    // ================== SUBMIT ==================
    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        const code = inputs[0].value.trim();
        if (code) {
          items.push({
            code: code,
            qty: inputs[1].value || "1"
          });
        }
      });

      if (items.length === 0) {
        alert("Chưa nhập dữ liệu");
        return;
      }

      try {
        await addDoc(collection(db, "orders"), {
          items,
          time: serverTimestamp(),
          status: "pending"
        });

        alert("✅ Đã gửi thành công!");
        location.reload();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    };

    addRow();   // Tạo dòng đầu tiên
  </script>
</body>
</html>
