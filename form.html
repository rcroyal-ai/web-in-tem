<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      padding: 8px;
      max-width: 100%;
      margin: 0 auto;
      background: #f9f9f9;
    }
    h2 { text-align: center; margin: 8px 0 12px 0; font-size: 18px; }
    
    .row {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      align-items: center;
    }
    .code-input { flex: 1; padding: 9px 8px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .qty-input { width: 65px; padding: 9px 6px; font-size: 15px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    .scan-btn {
      width: 44px; height: 44px; font-size: 18px;
      background: #4CAF50; color: white; border: none; border-radius: 8px;
    }

    button { width: 100%; padding: 11px; font-size: 15.5px; margin-top: 6px; border-radius: 6px; }

    #scanner-container {
      width: 240px;
      height: 180px;
      margin: 10px auto;
      display: none;
      border: 3px solid #4CAF50;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }

    #status { text-align: center; margin: 6px 0; font-size: 14px; font-weight: bold; }
    #close-camera {
      display: none;
      width: 240px;
      margin: 6px auto;
      padding: 9px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">🚀 Gửi đơn hàng</button>

  <div id="status"></div>
  <div id="scanner-container"></div>
  <button id="close-camera" onclick="stopScan()">✕ Đóng Camera</button>

  <!-- Thư viện html5-qrcode -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let html5QrCode = null;
    let currentInput = null;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    function startScan(input) {
      currentInput = input;
      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");
      const closeBtn = document.getElementById("close-camera");

      container.style.display = "block";
      closeBtn.style.display = "block";
      status.textContent = "Đang mở camera...";

      html5QrCode = new Html5Qrcode("scanner-container");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 220, height: 160 } },
        (decodedText) => {
          let code = decodedText;
          const match = decodedText.match(/893\d{10}/);
          if (match) code = match[0];

          currentInput.value = code;
          status.textContent = "✅ Quét thành công: " + code;
          stopScan();
          addRow();
        }
      ).catch(err => {
        status.textContent = "❌ Lỗi mở camera: " + err;
        console.error(err);
      });
    }

    function stopScan() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          html5QrCode = null;
        }).catch(() => {});
      }
      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("close-camera").style.display = "none";
      document.getElementById("status").textContent = "";
    }

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];
      rows.forEach(r => {
        const code = r.querySelector(".code-input").value.trim();
        if (code) {
          items.push({
            code: code,
            qty: r.querySelector(".qty-input").value || "1"
          });
        }
      });

      if (items.length === 0) return alert("Chưa nhập dữ liệu");

      try {
        await addDoc(collection(db, "orders"), {
          items,
          time: serverTimestamp(),
          status: "pending"
        });
        alert("✅ Đã gửi thành công!");
        location.reload();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    };

    addRow();
  </script>
</body>
</html>
