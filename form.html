<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      padding: 8px;
      max-width: 100%;
      margin: 0 auto;
      background: #f9f9f9;
    }
    h2 { 
      text-align: center; 
      margin: 8px 0 12px 0;
      font-size: 18px;
    }
    
    .row {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
      align-items: center;
    }
    .code-input {
      flex: 1;
      padding: 9px 8px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .qty-input {
      width: 65px;           /* Rất nhỏ */
      padding: 9px 6px;
      font-size: 15px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .scan-btn {
      width: 44px;
      height: 44px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      flex-shrink: 0;
    }

    button {
      width: 100%;
      padding: 11px;
      font-size: 15.5px;
      margin-top: 6px;
      border-radius: 6px;
    }

    /* Camera */
    #scanner-container {
      width: 220px;
      height: 165px;
      margin: 10px auto;
      display: none;
      border: 3px solid #4CAF50;
      border-radius: 10px;
      background: #000;
      overflow: hidden;
    }

    #status {
      text-align: center;
      margin: 6px 0;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
    }

    #close-camera {
      display: none;
      width: 220px;
      margin: 6px auto;
      padding: 8px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">🚀 Gửi đơn hàng</button>

  <div id="status"></div>
  <div id="scanner-container"></div>
  <button id="close-camera" onclick="stopScan()">✕ Đóng Camera</button>

  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;
    let isScanning = false;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    function startScan(input) {
      if (isScanning) return;
      currentInput = input;
      isScanning = true;

      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");
      const closeBtn = document.getElementById("close-camera");

      status.textContent = "Đang mở camera...";
      container.style.display = "block";
      closeBtn.style.display = "block";

      Quagga.init({
        inputStream: { type: "LiveStream", target: container, constraints: { facingMode: "environment" } },
        decoder: { readers: ["ean_reader", "code_128_reader"] },
        locate: true,
        numOfWorkers: 4
      }, function(err) {
        if (err) {
          status.textContent = "❌ Không mở camera";
          setTimeout(stopScan, 1500);
          return;
        }
        status.textContent = "✅ Hướng mã vào khung";
        Quagga.start();
      });

      Quagga.onDetected(handleDetection);
    }

    function handleDetection(data) {
      const raw = data.codeResult.code;
      const match = raw.match(/893\d{10}/);
      currentInput.value = match ? match[0] : raw;
      document.getElementById("status").textContent = "✅ Quét thành công!";
      setTimeout(stopScan, 700);
    }

    function stopScan() {
      Quagga.stop();
      Quagga.offDetected(handleDetection);
      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("close-camera").style.display = "none";
      document.getElementById("status").textContent = "";
      isScanning = false;
    }

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];
      rows.forEach(r => {
        const code = r.querySelector(".code-input").value.trim();
        if (code) {
          items.push({
            code: code,
            qty: r.querySelector(".qty-input").value || "1"
          });
        }
      });

      if (items.length === 0) return alert("Chưa nhập dữ liệu");
      
      try {
        await addDoc(collection(db, "orders"), { items, time: serverTimestamp(), status: "pending" });
        alert("✅ Đã gửi!");
        location.reload();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    };

    addRow();
  </script>
</body>
</html>
