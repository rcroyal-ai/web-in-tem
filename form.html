<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      padding: 15px;
      width: 320px; /* Giảm chiều rộng giao diện */
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .row {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
    }

    input {
      flex: 1;
      padding: 8px;
      font-size: 14px; /* Giảm kích thước font */
    }

    .qty-input {
      flex: 0.5; /* Thu nhỏ cột số lượng */
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      margin-top: 10px;
    }

    .scan-btn {
      width: 70px;
    }

    #video {
      width: 100%;
      max-width: 200px; /* Đảm bảo camera không tràn ra ngoài */
      height: 200px;
      margin-top: 10px;
      display: none;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Đảm bảo phần footer không bị tràn */
    .footer {
      margin-top: 10px;
      text-align: center;
    }

  </style>
</head>

<body>
  <h2>Nhập mã hàng</h2>

  <div class="container">
    <div id="list"></div>

    <button onclick="addRow()">+ Thêm dòng</button>
    <button onclick="submitData()">Gửi</button>

    <div id="video"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;
    let isScanning = false;
    let scanInProgress = false; // Prevent multiple scans

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";

      div.innerHTML = `
        <input placeholder="Mã hàng">
        <input class="qty-input" placeholder="SL" type="number">
        <button class="scan-btn">📷</button>
      `;

      const btn = div.querySelector("button");
      const input = div.querySelector("input");

      btn.onclick = () => startScan(input);

      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    function startScan(input) {
      if (scanInProgress) return; // Prevent new scan if one is already in progress

      currentInput = input;
      scanInProgress = true; // Set scanning flag to true

      const video = document.getElementById("video");
      video.style.display = "block";

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: video,
          constraints: {
            facingMode: "environment"
          }
        },
        decoder: {
          readers: ["ean_reader", "code_128_reader"]
        },
        locator: {
          patchSize: "medium",
          halfSample: true
        },
        locate: true
      }, function(err) {
        if (err) {
          console.log(err);
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function(data) {
        let raw = data.codeResult.code;

        // Only update input if the code matches a pattern
        let match = raw.match(/893\d{10}/);

        if (match) {
          currentInput.value = match[0];
        } else {
          currentInput.value = raw;
        }

        // Stop Quagga and hide video after detection
        Quagga.stop();
        video.innerHTML = "";
        video.style.display = "none";

        scanInProgress = false;  // Reset scanning flag
      });
    }

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        if (inputs[0].value)
          items.push({
            code: inputs[0].value,
            qty: inputs[1].value
          });
      });

      if (items.length === 0) {
        alert("Chưa nhập dữ liệu");
        return;
      }

      await addDoc(collection(db, "orders"), {
        items,
        time: Date.now()
      });

      alert("Đã gửi!");
      location.reload();
    }

    addRow();
  </script>

  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
</body>
</html>
