<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn hàng</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    body { font-family: Arial, sans-serif; padding: 15px; max-width: 500px; margin: auto; }
    h2 { text-align: center; margin-bottom: 20px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    .scan-btn { width: 60px; font-size: 22px; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; }
    button { padding: 14px; font-size: 16px; margin-top: 10px; width: 100%; border-radius: 6px; }
    #scanner-container { 
      width: 100%; 
      margin: 15px 0; 
      display: none; 
      border: 3px solid #4CAF50; 
      border-radius: 8px; 
      min-height: 300px;
      background: #000;
    }
    #status { text-align: center; margin: 10px 0; color: #666; font-size: 14px; }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>
  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">🚀 Gửi đơn hàng</button>

  <div id="status"></div>
  <div id="scanner-container"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = { /* giữ nguyên config của bạn */ };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;
    let isScanning = false;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    function startScan(input) {
      if (isScanning) return;
      currentInput = input;
      isScanning = true;

      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");
      
      status.textContent = "Đang mở camera...";
      container.style.display = "block";
      container.innerHTML = "";

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: container,
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        decoder: { readers: ["ean_reader", "code_128_reader"] },
        locate: true,
        numOfWorkers: 4
      }, function(err) {
        if (err) {
          console.error("Quagga Error:", err);
          status.textContent = "❌ Không mở được camera: " + err;
          setTimeout(stopScan, 2000);
          return;
        }
        status.textContent = "✅ Camera đang chạy - Hướng vào mã vạch";
        Quagga.start();
      });

      Quagga.onDetected(handleDetection);
    }

    function handleDetection(data) {
      const raw = data.codeResult.code;
      const match = raw.match(/893\d{10}/);
      currentInput.value = match ? match[0] : raw;

      document.getElementById("status").textContent = "✅ Đã quét: " + currentInput.value;
      stopScan();
      addRow();
    }

    function stopScan() {
      Quagga.stop();
      Quagga.offDetected(handleDetection);
      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("status").textContent = "";
      isScanning = false;
    }

    window.submitData = async function() { /* giữ nguyên hàm submit */ 
      // ... (copy hàm submit từ phiên bản trước)
    };

    window.addRow = addRow;
    addRow();
  </script>

  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>
</body>
</html>
