<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 12px;
      max-width: 480px;
      margin: auto;
      background: #f9f9f9;
    }
    h2 { 
      text-align: center; 
      margin: 10px 0 15px 0;
      font-size: 20px;
    }
    
    .row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }
    input {
      flex: 1;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .scan-btn {
      width: 55px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      margin-top: 8px;
      border-radius: 6px;
    }

    /* Khung Camera */
    #scanner-container {
      width: 260px;
      height: 190px;
      margin: 12px auto;
      display: none;
      border: 3px solid #4CAF50;
      border-radius: 12px;
      background: #000;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #status {
      text-align: center;
      margin: 8px 0;
      font-weight: bold;
      font-size: 14px;
    }

    #close-camera {
      display: none;
      width: 260px;
      margin: 8px auto;
      padding: 8px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">🚀 Gửi đơn hàng</button>

  <div id="status"></div>
  <div id="scanner-container"></div>
  <button id="close-camera" onclick="stopScan()">✕ Đóng Camera</button>

  <script src="https://unpkg.com/quagga/dist/quagga.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentInput = null;
    let isScanning = false;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    // ================== SCAN CAMERA ==================
    function startScan(input) {
      if (isScanning) return;
      currentInput = input;
      isScanning = true;

      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");
      const closeBtn = document.getElementById("close-camera");

      status.textContent = "Đang mở camera...";
      container.style.display = "block";
      closeBtn.style.display = "block";

      Quagga.init({
        inputStream: {
          type: "LiveStream",
          target: container,
          constraints: {
            facingMode: "environment",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        },
        decoder: { readers: ["ean_reader", "code_128_reader"] },
        locate: true,
        numOfWorkers: 4
      }, function(err) {
        if (err) {
          status.textContent = "❌ Không mở được camera";
          setTimeout(stopScan, 1500);
          return;
        }
        status.textContent = "✅ Hướng mã vạch vào khung";
        Quagga.start();
      });

      Quagga.onDetected(handleDetection);
    }

    function handleDetection(data) {
      const raw = data.codeResult.code;
      const match = raw.match(/893\d{10}/);
      currentInput.value = match ? match[0] : raw;

      document.getElementById("status").textContent = "✅ Quét thành công!";
      setTimeout(stopScan, 600);
    }

    function stopScan() {
      Quagga.stop();
      Quagga.offDetected(handleDetection);

      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("close-camera").style.display = "none";
      document.getElementById("status").textContent = "";
      isScanning = false;
    }

    // ================== SUBMIT ==================
    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const inputs = r.querySelectorAll("input");
        const code = inputs[0].value.trim();
        if (code) {
          items.push({
            code: code,
            qty: inputs[1].value || "1"
          });
        }
      });

      if (items.length === 0) return alert("Chưa nhập dữ liệu");

      try {
        await addDoc(collection(db, "orders"), {
          items,
          time: serverTimestamp(),
          status: "pending"
        });
        alert("✅ Đã gửi thành công!");
        location.reload();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    };

    // Khởi tạo dòng đầu tiên
    addRow();
  </script>
</body>
</html>
