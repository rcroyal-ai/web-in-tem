<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Nhập đơn</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      padding: 8px;
      max-width: 100%;
      margin: 0 auto;
      background: #f9f9f9;
    }
    h2 { text-align: center; margin: 10px 0 12px 0; font-size: 18px; }
    
    .row { display: flex; gap: 5px; margin-bottom: 8px; align-items: center; }
    .code-input { flex: 1; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; }
    .qty-input { width: 68px; padding: 10px; font-size: 15px; text-align: center; border: 1px solid #ccc; border-radius: 6px; }
    .scan-btn { width: 48px; height: 48px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 8px; }

    button { width: 100%; padding: 12px; font-size: 16px; margin-top: 8px; border-radius: 6px; }

    #scanner-container {
      width: 100%;
      max-width: 260px;
      height: 200px;
      margin: 12px auto;
      display: none;
      border: 3px solid #4CAF50;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #status { text-align: center; margin: 10px 0; font-weight: bold; color: #333; }
    #close-camera {
      display: none;
      width: 260px;
      margin: 8px auto;
      padding: 10px;
      background: #f44336;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h2>Nhập mã hàng</h2>

  <div id="list"></div>

  <button onclick="addRow()">+ Thêm dòng</button>
  <button onclick="submitData()">🚀 Gửi đơn hàng</button>

  <div id="status"></div>
  <div id="scanner-container"></div>
  <button id="close-camera" onclick="stopScan()">✕ Đóng Camera</button>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let html5QrCode = null;
    let currentInput = null;
    let isScanning = false;

    function addRow() {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML = `
        <input type="text" placeholder="Mã hàng" class="code-input">
        <input type="number" placeholder="SL" class="qty-input" value="1" min="1">
        <button class="scan-btn" type="button">📷</button>
      `;

      div.querySelector(".scan-btn").onclick = () => startScan(div.querySelector(".code-input"));
      document.getElementById("list").appendChild(div);
    }

    window.addRow = addRow;

    async function startScan(input) {
      if (isScanning) return;
      isScanning = true;
      currentInput = input;

      const container = document.getElementById("scanner-container");
      const status = document.getElementById("status");
      const closeBtn = document.getElementById("close-camera");

      container.style.display = "block";
      closeBtn.style.display = "block";
      status.textContent = "Đang mở camera...";

      if (html5QrCode) await stopScan();

      html5QrCode = new Html5Qrcode("scanner-container");

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          { 
            fps: 15, 
            qrbox: { width: 230, height: 180 },
            aspectRatio: 1.0,
            disableFlip: false
          },
          (decodedText) => {
            const match = decodedText.match(/893\d{10}/);
            const code = match ? match[0] : decodedText;
            
            currentInput.value = code;
            status.textContent = `✅ Quét: ${code}`;
            stopScan();
            addRow();
          }
        );
        status.textContent = "✅ Hướng mã vạch vào khung giữa";
      } catch (err) {
        status.textContent = "❌ Không mở camera. Hãy mở bằng Safari!";
        console.error(err);
        isScanning = false;
      }
    }

    async function stopScan() {
      if (html5QrCode) {
        try { await html5QrCode.stop(); html5QrCode.clear(); } catch(e){}
        html5QrCode = null;
      }
      document.getElementById("scanner-container").style.display = "none";
      document.getElementById("close-camera").style.display = "none";
      document.getElementById("status").textContent = "";
      isScanning = false;
    }

    window.submitData = async function() {
      const rows = document.querySelectorAll(".row");
      let items = [];

      rows.forEach(r => {
        const code = r.querySelector(".code-input").value.trim();
        if (code) {
          items.push({
            code: code,
            qty: r.querySelector(".qty-input").value || "1"
          });
        }
      });

      if (items.length === 0) return alert("Chưa nhập dữ liệu");

      try {
        await addDoc(collection(db, "orders"), {
          items,
          time: serverTimestamp(),
          status: "pending"
        });
        alert("✅ Đã gửi thành công!");
        location.reload();
      } catch (e) {
        alert("Lỗi: " + e.message);
      }
    };

    addRow();
  </script>
</body>
</html>
