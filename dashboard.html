<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard BARCODE</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #1a73e8;
    }

    .layout {
      display: flex;
      gap: 20px;
    }

    #today-orders { flex: 2; }

    #history {
      flex: 1;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
    }

    .order-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      border-left: 5px solid #1a73e8;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-time {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }

    .copy-btn {
      background: #f1f3f4;
      border: 1px solid #1a73e8;
      color: #1a73e8;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .copy-btn:hover {
      background: #1a73e8;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th {
      text-align: left;
      background: #f8f9fa;
      padding: 6px;
      font-size: 0.85rem;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
      background: #f5faff;
    }

    .col-code { width: 20%; font-weight: bold; color: #d63031; }
    .col-name { width: 50%; }
    .col-qty { width: 30%; text-align: center; }

    .qty-box {
      background: #e8f0fe;
      padding: 4px 10px;
      border-radius: 6px;
      display: inline-block;
      min-width: 40px;
      font-weight: bold;
    }

    .history-date {
      padding: 8px;
      background: #f1f3f4;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .history-date:hover {
      background: #e0e0e0;
    }

  </style>
</head>

<body>

<h2>📦 QUẢN LÝ IN BARCODE</h2>

<div class="layout">
  <div id="today-orders"></div>
  <div id="history"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

// 🔥 LOAD DATA.JSON
let productMap = {};

async function loadProducts() {
  const res = await fetch("/data.json"); // ⚠️ QUAN TRỌNG
  productMap = await res.json();
}

await loadProducts();

// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "in-barcode.firebaseapp.com",
  projectId: "in-barcode",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// parse date
function parseDate(time) {
  if (!time) return null;
  if (typeof time.toDate === "function") return time.toDate();
  return new Date(time);
}

// copy excel
window.copyOrderData = function(btn) {
  const card = btn.closest('.order-card');
  const rows = card.querySelectorAll('tbody tr');

  let text = "Barcode\tSo luong\n";

  rows.forEach((row, i) => {
    const code = row.querySelector('.col-code')?.textContent.trim() || "";
    const qty = row.querySelector('.qty-box')?.textContent.trim() || "";
    text += `${code}\t${qty}${i < rows.length - 1 ? '\n' : ''}`;
  });

  navigator.clipboard.writeText(text);
  btn.innerText = "✅ Copied";
  setTimeout(() => btn.innerText = "📋 Copy", 1200);
};

// toggle history
window.toggleHistory = function(el) {
  const content = el.nextElementSibling;
  content.style.display = content.style.display === "none" ? "block" : "none";
};

// today range
const startOfToday = new Date();
startOfToday.setHours(0,0,0,0);

const endOfToday = new Date();
endOfToday.setHours(23,59,59,999);

// query
const q = query(collection(db, "orders"), orderBy("time", "desc"));

onSnapshot(q, (snapshot) => {
  try {

    const todayContainer = document.getElementById("today-orders");
    const historyContainer = document.getElementById("history");

    todayContainer.innerHTML = "";
    historyContainer.innerHTML = "";

    const oldOrders = {};

    snapshot.forEach(doc => {
      const data = doc.data();
      const date = parseDate(data.time);
      if (!date) return;

      const dateStr = date.toISOString().split("T")[0];
      const isToday = date >= startOfToday && date <= endOfToday;

      if (isToday) {
        todayContainer.appendChild(renderOrder(data));
      } else {
        if (!oldOrders[dateStr]) oldOrders[dateStr] = [];
        oldOrders[dateStr].push(data);
      }
    });

    Object.keys(oldOrders).forEach(date => {
      const section = document.createElement("div");

      section.innerHTML = `
        <div class="history-date" onclick="toggleHistory(this)">
          📅 ${date} (${oldOrders[date].length})
        </div>
        <div style="display:none">
          ${oldOrders[date].map(o => renderOrderHTML(o)).join("")}
        </div>
      `;

      historyContainer.appendChild(section);
    });

  } catch (err) {
    console.error("🔥 Lỗi:", err);
  }
});

// render DOM
function renderOrder(data) {
  const card = document.createElement("div");
  card.className = "order-card";
  card.innerHTML = renderOrderHTML(data);
  return card;
}

// render HTML
function renderOrderHTML(data) {
  const date = parseDate(data.time);
  const timeStr = date ? date.toLocaleString("vi-VN") : "---";

  const rows = (data.items || []).map(item => {
    const code = String(item.code || "");
    const name = productMap[code] || "";

    return `
      <tr>
        <td class="col-code">${code}</td>
        <td class="col-name">${name}</td>
        <td class="col-qty">
          <div class="qty-box">${item.qty || ""}</div>
        </td>
      </tr>
    `;
  }).join("");

  return `
    <div class="order-header">
      <span class="order-time">🕒 ${timeStr}</span>
      <button class="copy-btn" onclick="copyOrderData(this)">📋 Copy</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Barcode</th>
          <th>Diễn giải</th>
          <th style="text-align:center">Số lượng</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

</script>

</body>
</html>
