<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard BARCODE</title>

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #1a73e8;
    }

    .layout {
      display: flex;
      gap: 20px;
    }

    #today-orders { flex: 2; }

    #history {
      flex: 1;
      max-height: 90vh;
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border-radius: 10px;
    }

    .order-card {
      background: #fff;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 15px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      border-left: 5px solid #1a73e8;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .order-time {
      font-size: 0.85rem;
      color: #666;
      font-weight: bold;
    }

    .copy-btn {
      background: #f1f3f4;
      border: 1px solid #1a73e8;
      color: #1a73e8;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .copy-btn:hover {
      background: #1a73e8;
      color: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 6px;
      border-bottom: 1px solid #eee;
    }

    tbody tr:hover {
      background: #f5faff;
    }

    .col-code {
      font-family: monospace;
      color: #d63031;
      font-weight: bold;
    }

    .col-qty {
      text-align: center;
      font-weight: bold;
      background: #e8f0fe;
      border-radius: 4px;
    }

    .history-date {
      padding: 8px;
      background: #f1f3f4;
      margin-bottom: 5px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .history-date:hover {
      background: #e0e0e0;
    }

  </style>
</head>

<body>

<h2>📦 QUẢN LÝ IN BARCODE</h2>

<div class="layout">
  <div id="today-orders"></div>
  <div id="history"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
  authDomain: "in-barcode.firebaseapp.com",
  projectId: "in-barcode",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🧠 parse date chống crash
function parseDate(time) {
  if (!time) return null;
  if (typeof time.toDate === "function") return time.toDate();
  return new Date(time);
}

// 📋 copy excel
window.copyOrderData = function(btn) {
  const card = btn.closest('.order-card');
  const rows = card.querySelectorAll('tbody tr');

  let text = "Ma hang\tSo luong\n";

  rows.forEach((row, i) => {
    const code = row.querySelector('.col-code')?.textContent.trim() || "";
    const qty = row.querySelector('.col-qty')?.textContent.trim() || "";
    text += `${code}\t${qty}${i < rows.length - 1 ? '\n' : ''}`;
  });

  navigator.clipboard.writeText(text);
  btn.innerText = "✅ Copied";
  setTimeout(() => btn.innerText = "📋 Copy", 1200);
};

// toggle lịch sử
window.toggleHistory = function(el) {
  const content = el.nextElementSibling;
  content.style.display = content.style.display === "none" ? "block" : "none";
};

// thời gian hôm nay
const startOfToday = new Date();
startOfToday.setHours(0,0,0,0);

const endOfToday = new Date();
endOfToday.setHours(23,59,59,999);

// query
const q = query(collection(db, "orders"), orderBy("time", "desc"));

onSnapshot(q, (snapshot) => {
  try {

    const todayContainer = document.getElementById("today-orders");
    const historyContainer = document.getElementById("history");

    todayContainer.innerHTML = "";
    historyContainer.innerHTML = "";

    const oldOrders = {};

    snapshot.forEach(doc => {
      const data = doc.data();
      const date = parseDate(data.time);
      if (!date) return;

      const dateStr = date.toISOString().split("T")[0];
      const isToday = date >= startOfToday && date <= endOfToday;

      if (isToday) {
        todayContainer.appendChild(renderOrder(data));
      } else {
        if (!oldOrders[dateStr]) oldOrders[dateStr] = [];
        oldOrders[dateStr].push(data);
      }
    });

    // render history
    Object.keys(oldOrders).forEach(date => {
      const section = document.createElement("div");

      section.innerHTML = `
        <div class="history-date" onclick="toggleHistory(this)">
          📅 ${date} (${oldOrders[date].length})
        </div>
        <div style="display:none">
          ${oldOrders[date].map(o => renderOrderHTML(o)).join("")}
        </div>
      `;

      historyContainer.appendChild(section);
    });

  } catch (err) {
    console.error("🔥 Lỗi:", err);
    document.body.innerHTML = "<h2>🔥 Lỗi render - mở F12 xem chi tiết</h2>";
  }
});

// render DOM
function renderOrder(data) {
  const card = document.createElement("div");
  card.className = "order-card";
  card.innerHTML = renderOrderHTML(data);
  return card;
}

// render HTML
function renderOrderHTML(data) {
  const date = parseDate(data.time);
  const timeStr = date ? date.toLocaleString("vi-VN") : "---";

  const rows = (data.items || []).map(item => `
    <tr>
      <td class="col-code">${item.code || ""}</td>
      <td class="col-qty">${item.qty || ""}</td>
    </tr>
  `).join("");

  return `
    <div class="order-header">
      <span class="order-time">🕒 ${timeStr}</span>
      <button class="copy-btn" onclick="copyOrderData(this)">📋 Copy</button>
    </div>
    <table>
  <thead>
    <tr>
      <th>Barcode</th>
      <th style="text-align:center">Số lượng</th>
    </tr>
  </thead>
  <tbody>${rows}</tbody>
</table>
th {
  text-align: left;
  background: #f8f9fa;
  padding: 6px;
  font-size: 0.85rem;
}
  `;
}

</script>

</body>
</html>
