<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
</head>
<body>
  <h2>Đơn hàng</h2>
  <div id="orders"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const q = query(collection(db, "orders"), orderBy("time", "desc"));

    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();
        const div = document.createElement("div");

        div.innerHTML = data.items.map(i =>
          `${i.code} x ${i.qty}`
        ).join("<br>");

        container.appendChild(div);
        container.appendChild(document.createElement("hr"));
      });
    });
  </script>
</body>
</html>
