<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Đơn Hàng</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h2 {
      text-align: center;
      color: #1a73e8;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    #orders {
      max-width: 800px;
      margin: 0 auto;
    }

    .order-card {
      background: #fff;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border-left: 5px solid #1a73e8;
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #eee;
    }

    .order-time {
      font-size: 0.9rem;
      color: #666;
      font-weight: bold;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .copy-btn {
      background-color: #f1f3f4;
      color: #5f6368;
      border: 1px solid #dadce0;
      padding: 5px 12px;
      font-size: 0.75rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .copy-btn:hover {
      background-color: #e8f0fe;
      color: #1a73e8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      background-color: #f8f9fa;
      padding: 8px;
      font-size: 0.85rem;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid #f1f1f1;
    }

    .col-code { width: 70%; font-family: monospace; color: #d63031; font-weight: bold; }
    .col-qty { width: 30%; text-align: center; font-weight: bold; background: #e8f0fe; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>📦 Quản lí in Barcode</h2>
  <div id="orders"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBA9z_fWdU2fOGQazkmMsxhrw_ZWkz49JY",
      authDomain: "in-barcode.firebaseapp.com",
      projectId: "in-barcode",
      storageBucket: "in-barcode.firebasestorage.app",
      messagingSenderId: "843997057895",
      appId: "1:843997057895:web:68d856ce7b4050c13895c2"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // HÀM COPY ĐÃ CHỈNH SỬA: CHỈ LẤY MÃ + SỐ LƯỢNG
    window.copyOrderData = function(btn) {
      const card = btn.closest('.order-card');
      const rows = card.querySelectorAll('tbody tr');
      
      let textToCopy = "";
      rows.forEach((row, index) => {
        const code = row.querySelector('.col-code').textContent.trim();
        const qty = row.querySelector('.col-qty').textContent.trim();
        
        // Chỉ lấy: Mã_hàng [khoảng cách] Số_lượng
        textToCopy += `${code} ${qty}${index < rows.length - 1 ? '\n' : ''}`;
      });

      navigator.clipboard.writeText(textToCopy).then(() => {
        const originalText = btn.innerText;
        btn.innerText = "✅ Xong!";
        setTimeout(() => { btn.innerText = originalText; }, 1200);
      });
    }

    const q = query(collection(db, "orders"), orderBy("time", "desc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById("orders");
      container.innerHTML = "";

      snapshot.forEach(doc => {
        const data = doc.data();
        const timeStr = data.time ? new Date(data.time).toLocaleString("vi-VN") : "---";

        const card = document.createElement("div");
        card.className = "order-card";
        
        let tableRows = data.items.map(item => `
          <tr>
            <td class="col-code">${item.code}</td>
            <td class="col-qty">${item.qty}</td>
          </tr>
        `).join("");

        card.innerHTML = `
          <div class="order-header">
            <span class="order-time">🕒 ${timeStr}</span>
            <div class="header-right">
              <button class="copy-btn" onclick="copyOrderData(this)">📋 Copy</button>
            </div>
          </div>
          <table>
            <thead><tr><th>Mã hàng</th><th style="text-align:center">SL</th></tr></thead>
            <tbody>${tableRows}</tbody>
          </table>
        `;
        container.appendChild(card);
      });
    });
  </script>
</body>
</html>
